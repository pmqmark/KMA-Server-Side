name: Deploy to KMA server

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all source files
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            APP_DIR=/home/team.qmarktechnolabs/KMA-Server-Side
            APP_NAME=kma-server
            BRANCH=main

            # Non-interactive SSH shells don't load nvm; do it explicitly if present.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd "$APP_DIR"
            echo "Deploying $(git rev-parse --short HEAD) -> origin/$BRANCH"

            git fetch --prune origin "$BRANCH"
            # .env is untracked (gitignored), so reset --hard leaves it alone.
            git reset --hard "origin/$BRANCH"
            echo "Now at $(git log -1 --format='%h %s')"

            npm ci --omit=dev

            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              pm2 start npm --name "$APP_NAME" -- start
            fi
            pm2 save

            # Health check: any HTTP response (even 404) means Express is listening.
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
              if [ "$code" != "000" ]; then
                echo "Server is up (HTTP $code)"
                exit 0
              fi
              sleep 3
            done

            echo "Server did not respond on :8080 after deploy"
            pm2 logs "$APP_NAME" --lines 50 --nostream
            exit 1
